<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Pro | VilchesLinense4</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a78bfa;
            --secondary: #06b6d4;
            --bg: #030712;
            --card: #111827;
            --neon-border: linear-gradient(90deg, #a78bfa, #06b6d4, #f472b6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Urbanist', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(167, 139, 250, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Botón Volver Estilo Moderno */
        .back-btn {
            position: fixed; top: 15px; left: 15px;
            color: #94a3b8; text-decoration: none;
            background: rgba(255,255,255,0.03); padding: 10px 18px;
            border-radius: 12px; font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            z-index: 100; transition: 0.3s;
        }

        /* Contenedor Principal con Borde de Neón */
        .card-wrapper {
            width: 100%;
            max-width: 450px;
            background: var(--neon-border);
            padding: 1px; /* El grosor del borde neón */
            border-radius: 28px;
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.2);
        }

        .container {
            background: var(--card);
            padding: 30px 25px;
            border-radius: 27px;
        }

        h2 { text-align: center; font-size: 1.8rem; font-weight: 800; margin-bottom: 5px; background: var(--neon-border); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 30px; }

        /* Pantalla de Contraseña con borde degradado */
        .result-box {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 4px;
            background: var(--neon-border);
            margin-bottom: 25px;
        }

        .result-inner {
            background: #0f172a;
            border-radius: 17px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        #password-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            color: #f8fafc;
            word-break: break-all;
            flex-grow: 1;
        }

        .copy-btn {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .copy-btn:active { transform: scale(0.9); background: var(--primary); }

        /* Fortaleza */
        .strength-container { margin-bottom: 30px; }
        .strength-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 10px; color: #94a3b8; }
        .strength-bars { display: flex; gap: 6px; height: 6px; }
        .bar { flex: 1; background: #374151; border-radius: 10px; transition: 0.4s; }

        /* Controles */
        .section-title { font-size: 0.9rem; font-weight: 600; color: #94a3b8; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        
        .option-item {
            background: rgba(255,255,255,0.03);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #374151;
            border-radius: 10px;
            appearance: none;
            margin: 20px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; width: 22px; height: 22px;
            background: white; border-radius: 50%;
            border: 4px solid var(--primary); cursor: pointer;
            box-shadow: 0 0 10px var(--primary);
        }

        input[type="checkbox"] {
            width: 22px; height: 22px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Botón Generar con Efecto Glow */
        .btn-generate {
            width: 100%;
            padding: 20px;
            margin-top: 20px;
            background: var(--neon-border);
            border: none;
            border-radius: 18px;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(167, 139, 250, 0.3);
            transition: 0.3s;
        }
        .btn-generate:active { transform: scale(0.98); opacity: 0.9; }

        @media (max-width: 400px) {
            .container { padding: 20px 15px; }
            h2 { font-size: 1.5rem; }
            #password-display { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <a href="https://vilcheslinense4.github.io/Mi-primer-portafolios/" class="back-btn">← Volver</a>

    <div class="card-wrapper">
        <div class="container">
            <h2>Generador Pro</h2>
            <p class="subtitle">Seguridad avanzada en un instante</p>

            <div class="result-box">
                <div class="result-inner">
                    <span id="password-display">P4ssw0rd!</span>
                    <button class="copy-btn" id="copyBtn">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                    </button>
                </div>
            </div>

            <div class="strength-container">
                <div class="strength-label">
                    <span>Fortaleza: <b id="st-text">Media</b></span>
                </div>
                <div class="strength-bars">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <p class="section-title">Ajustes</p>
            
            <div class="option-item" style="flex-direction: column; align-items: flex-start;">
                <div style="display: flex; justify-content: space-between; width: 100%;">
                    <span>Longitud</span>
                    <b id="length-val" style="color: var(--primary)">16</b>
                </div>
                <input type="range" id="length" min="8" max="32" value="16">
            </div>

            <div class="option-item">
                <span>Mayúsculas (A-Z)</span>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="option-item">
                <span>Números (0-9)</span>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="option-item">
                <span>Símbolos (!@#)</span>
                <input type="checkbox" id="symbols" checked>
            </div>

            <button class="btn-generate" id="generateBtn">GENERAR NUEVA CLAVE</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('password-display');
        const lengthInput = document.getElementById('length');
        const lengthVal = document.getElementById('length-val');
        const bars = document.querySelectorAll('.bar');
        const stText = document.getElementById('st-text');

        const keys = {
            lower: "abcdefghijklmnopqrstuvwxyz",
            upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            number: "0123456789",
            symbol: "!@#$%^&*()_+~"
        };

        function generate() {
            let charset = keys.lower;
            if (document.getElementById('uppercase').checked) charset += keys.upper;
            if (document.getElementById('numbers').checked) charset += keys.number;
            if (document.getElementById('symbols').checked) charset += keys.symbol;

            let password = "";
            for (let i = 0; i < lengthInput.value; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            display.innerText = password;
            updateStrength();
        }

        function updateStrength() {
            const len = lengthInput.value;
            let level = 1;
            if (len > 12) level = 2;
            if (len > 18) level = 3;
            if (len > 24) level = 4;

            const colors = ['#ef4444', '#f59e0b', '#06b6d4', '#10b981'];
            const texts = ['Débil', 'Media', 'Fuerte', 'Muy Segura'];

            bars.forEach((bar, idx) => {
                bar.style.background = idx < level ? colors[level-1] : '#374151';
                bar.style.boxShadow = idx < level ? `0 0 10px ${colors[level-1]}` : 'none';
            });
            stText.innerText = texts[level-1];
            stText.style.color = colors[level-1];
        }

        lengthInput.addEventListener('input', () => {
            lengthVal.innerText = lengthInput.value;
            generate();
        });

        document.getElementById('generateBtn').addEventListener('click', generate);
        
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(display.innerText);
            alert('¡Contraseña copiada!');
        });

        generate();
    </script>
</body>
</html>

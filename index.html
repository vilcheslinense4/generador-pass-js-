<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas Pro | VilchesLinense4</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.5);
            --bg: #0f172a;
            --card: rgba(15, 23, 42, 0.8);
            --text: #f1f5f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Urbanist', sans-serif; }

        body {
            background: radial-gradient(circle at top right, #1e293b, #080d17);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Botón Volver con Estilo Cristal */
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            color: var(--text); text-decoration: none;
            background: rgba(255,255,255,0.05); padding: 12px 24px;
            border-radius: 14px; font-weight: 600; backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); transition: 0.4s;
            display: flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { background: var(--primary); color: #0f172a; transform: translateX(-5px); }

        .container {
            width: 100%; max-width: 480px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 40px; border-radius: 32px;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.7);
        }

        h2 { text-align: center; margin-bottom: 8px; font-size: 2rem; letter-spacing: -1px; }
        .subtitle { text-align: center; opacity: 0.5; margin-bottom: 30px; font-size: 0.95rem; }

        /* Pantalla de Contraseña */
        .result-container {
            background: rgba(0, 0, 0, 0.3); padding: 20px;
            border-radius: 20px; display: flex;
            justify-content: space-between; align-items: center;
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        #password-display { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 1.3rem; 
            color: var(--primary); 
            word-break: break-all;
            letter-spacing: 1px;
        }
        .copy-btn { 
            background: rgba(255,255,255,0.1); border: none; 
            padding: 10px 18px; border-radius: 12px; cursor: pointer; 
            color: white; font-weight: bold; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .copy-btn:hover { background: var(--primary); color: #0f172a; transform: scale(1.05); }
        .copy-btn.success { background: #22c55e; color: white; border-color: #22c55e; }

        /* Barra de fortaleza Mejorada */
        .strength-meter { height: 8px; width: 100%; background: #1e293b; border-radius: 10px; margin-bottom: 30px; overflow: hidden; position: relative;}
        #strength-bar { 
            height: 100%; width: 0%; transition: 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); 
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Opciones con mejor espaciado */
        .options-grid { display: grid; gap: 20px; }
        .option { display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
        
        .range-container { margin-bottom: 10px; }
        input[type="range"] { 
            width: 100%; accent-color: var(--primary); margin: 15px 0; 
            cursor: pointer; background: #1e293b; height: 6px; border-radius: 5px;
        }
        
        input[type="checkbox"] { 
            width: 22px; height: 22px; accent-color: var(--primary); cursor: pointer;
            transition: 0.2s;
        }

        /* Botón Generar con Gradiente Animado */
        .btn-generate {
            width: 100%; padding: 18px; margin-top: 30px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            border: none; border-radius: 20px; color: white;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.4s;
            box-shadow: 0 10px 25px -5px rgba(0, 210, 255, 0.4);
        }
        .btn-generate:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 20px 35px -5px rgba(0, 210, 255, 0.6);
            filter: brightness(1.1);
        }
        .btn-generate:active { transform: translateY(-1px); }

    </style>
</head>
<body>

    <a href="https://vilcheslinense4.github.io/Mi-primer-portafolios/" class="back-btn"><span>←</span> Volver al Portafolio</a>

    <div class="container">
        <h2>🛡️ Generador Pro</h2>
        <p class="subtitle">Seguridad de grado militar a un clic</p>

        <div class="result-container">
            <span id="password-display">Cargando...</span>
            <button class="copy-btn" id="copyBtn">Copiar</button>
        </div>

        <div class="strength-meter">
            <div id="strength-bar"></div>
        </div>

        <div class="options-grid">
            <div class="range-container">
                <div class="option">
                    <span>Longitud</span>
                    <span style="color: var(--primary); font-weight: 700;" id="length-val">16</span>
                </div>
                <input type="range" id="length" min="8" max="40" value="16">
            </div>

            <div class="option">
                <span>Mayúsculas (ABC)</span>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="option">
                <span>Números (123)</span>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="option">
                <span>Símbolos (#$&)</span>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>

        <button class="btn-generate" id="generateBtn">Generar Nueva Clave</button>
    </div>

    <script>
        const display = document.getElementById('password-display');
        const lengthInput = document.getElementById('length');
        const lengthVal = document.getElementById('length-val');
        const upperCheck = document.getElementById('uppercase');
        const numCheck = document.getElementById('numbers');
        const symCheck = document.getElementById('symbols');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const strengthBar = document.getElementById('strength-bar');

        const keys = {
            upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            lower: "abcdefghijklmnopqrstuvwxyz",
            number: "0123456789",
            symbol: "!@#$%^&*()_+~`|}{[]:;?><,./-="
        };

        function generatePassword() {
            let charset = keys.lower;
            if (upperCheck.checked) charset += keys.upper;
            if (numCheck.checked) charset += keys.number;
            if (symCheck.checked) charset += keys.symbol;

            let password = "";
            for (let i = 0; i < lengthInput.value; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            display.innerText = password;
            updateStrength(password);
        }

        function updateStrength(pass) {
            let strength = 0;
            if (pass.length >= 12) strength += 40;
            if (pass.length >= 20) strength += 10;
            if (/[A-Z]/.test(pass)) strength += 15;
            if (/[0-9]/.test(pass)) strength += 15;
            if (/[^A-Za-z0-9]/.test(pass)) strength += 20;

            strengthBar.style.width = strength + "%";
            
            if (strength < 40) {
                strengthBar.style.background = "#ef4444";
                strengthBar.style.boxShadow = "0 0 15px rgba(239, 68, 68, 0.5)";
            } else if (strength < 75) {
                strengthBar.style.background = "#eab308";
                strengthBar.style.boxShadow = "0 0 15px rgba(234, 179, 8, 0.5)";
            } else {
                strengthBar.style.background = "#22c55e";
                strengthBar.style.boxShadow = "0 0 15px rgba(34, 197, 94, 0.5)";
            }
        }

        lengthInput.addEventListener('input', () => {
            lengthVal.innerText = lengthInput.value;
            generatePassword(); // Generar automáticamente al mover la barra
        });

        generateBtn.addEventListener('click', generatePassword);
        
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(display.innerText);
            copyBtn.innerText = "¡Copiado!";
            copyBtn.classList.add('success');
            
            setTimeout(() => {
                copyBtn.innerText = "Copiar";
                copyBtn.classList.remove('success');
            }, 1500);
        });

        generatePassword();
    </script>
</body>
</html>

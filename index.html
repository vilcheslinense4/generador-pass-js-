<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas | VilchesLinense4</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Urbanist', sans-serif; }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Botón Volver */
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            color: var(--text); text-decoration: none;
            background: rgba(255,255,255,0.1); padding: 10px 20px;
            border-radius: 12px; font-weight: bold; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .back-btn:hover { background: var(--primary); color: #0f172a; }

        .container {
            width: 100%; max-width: 500px;
            background: var(--card);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        h2 { text-align: center; margin-bottom: 5px; font-size: 1.8rem; }
        .subtitle { text-align: center; opacity: 0.6; margin-bottom: 25px; font-size: 0.9rem; }

        .result-container {
            background: #1e293b; padding: 15px 20px;
            border-radius: 15px; display: flex;
            justify-content: space-between; align-items: center;
            margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);
        }
        #password-display { font-family: 'Courier New', monospace; font-size: 1.2rem; color: var(--primary); word-break: break-all; }
        .copy-btn { background: var(--primary); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .copy-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        .strength-meter { height: 6px; width: 100%; background: #334155; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        #strength-bar { height: 100%; width: 0%; transition: 0.5s; }

        .options-grid { display: grid; gap: 15px; }
        .option { display: flex; justify-content: space-between; align-items: center; }
        
        input[type="range"] { width: 100%; accent-color: var(--primary); margin: 10px 0; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }

        .btn-generate {
            width: 100%; padding: 15px; margin-top: 25px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            border: none; border-radius: 15px; color: white;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-generate:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,210,255,0.3); }

    </style>
</head>
<body>

    <a href="https://vilcheslinense4.github.io/Mi-primer-portafolios/" class="back-btn">← Volver</a>

    <div class="container">
        <h2>🛡️ Generador Pro</h2>
        <p class="subtitle">Crea contraseñas seguras al instante</p>

        <div class="result-container">
            <span id="password-display">P4ssw0rd!</span>
            <button class="copy-btn" id="copyBtn">Copiar</button>
        </div>

        <div class="strength-meter">
            <div id="strength-bar"></div>
        </div>

        <div class="options-grid">
            <div class="option">
                <span>Longitud: <b id="length-val">12</b></span>
            </div>
            <input type="range" id="length" min="6" max="30" value="12">

            <div class="option">
                <span>Incluir Mayúsculas</span>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="option">
                <span>Incluir Números</span>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="option">
                <span>Incluir Símbolos</span>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>

        <button class="btn-generate" id="generateBtn">Generar Contraseña</button>
    </div>

    <script>
        const display = document.getElementById('password-display');
        const lengthInput = document.getElementById('length');
        const lengthVal = document.getElementById('length-val');
        const upperCheck = document.getElementById('uppercase');
        const numCheck = document.getElementById('numbers');
        const symCheck = document.getElementById('symbols');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const strengthBar = document.getElementById('strength-bar');

        const keys = {
            upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            lower: "abcdefghijklmnopqrstuvwxyz",
            number: "0123456789",
            symbol: "!@#$%^&*()_+~`|}{[]:;?><,./-="
        };

        function generatePassword() {
            let charset = keys.lower;
            if (upperCheck.checked) charset += keys.upper;
            if (numCheck.checked) charset += keys.number;
            if (symCheck.checked) charset += keys.symbol;

            let password = "";
            for (let i = 0; i < lengthInput.value; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            display.innerText = password;
            updateStrength(password);
        }

        function updateStrength(pass) {
            let strength = 0;
            if (pass.length > 10) strength += 40;
            if (/[A-Z]/.test(pass)) strength += 20;
            if (/[0-9]/.test(pass)) strength += 20;
            if (/[^A-Za-z0-9]/.test(pass)) strength += 20;

            strengthBar.style.width = strength + "%";
            if (strength < 50) strengthBar.style.background = "#ef4444";
            else if (strength < 80) strengthBar.style.background = "#eab308";
            else strengthBar.style.background = "#22c55e";
        }

        lengthInput.addEventListener('input', () => lengthVal.innerText = lengthInput.value);
        generateBtn.addEventListener('click', generatePassword);
        
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(display.innerText);
            copyBtn.innerText = "¡Copiado!";
            setTimeout(() => copyBtn.innerText = "Copiar", 2000);
        });

        generatePassword();
    </script>
</body>
</html>

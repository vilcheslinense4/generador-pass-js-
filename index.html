<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Pro Compact | VilchesLinense4</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a78bfa;
            --secondary: #06b6d4;
            --bg: #030712;
            --card: #111827;
            --neon: linear-gradient(90deg, #a78bfa, #06b6d4, #f472b6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Urbanist', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(167, 139, 250, 0.1), transparent),
                              radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.1), transparent);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px; /* Reducido para móviles pequeños */
        }

        /* Botón Volver más discreto */
        .back-btn {
            position: fixed; top: 10px; left: 10px;
            color: #94a3b8; text-decoration: none;
            background: rgba(255,255,255,0.03); padding: 8px 14px;
            border-radius: 10px; font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px);
            z-index: 100;
        }

        /* Tarjeta más Estrecha y Compacta */
        .card-wrapper {
            width: 100%;
            max-width: 380px; /* Reducido de 450px a 380px */
            background: var(--neon);
            padding: 1px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .container {
            background: var(--card);
            padding: 20px; /* Menos relleno interno */
            border-radius: 23px;
        }

        h2 { text-align: center; font-size: 1.4rem; font-weight: 800; background: var(--neon); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { text-align: center; color: #64748b; font-size: 0.75rem; margin-bottom: 20px; }

        /* Resultado más fino */
        .result-box {
            background: var(--neon);
            padding: 1px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .result-inner {
            background: #0f172a;
            border-radius: 15px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #password-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: #f8fafc;
            word-break: break-all;
            padding-right: 10px;
        }

        .copy-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Fortaleza Compacta */
        .strength-container { margin-bottom: 20px; }
        .strength-label { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 8px; color: #94a3b8; }
        .strength-bars { display: flex; gap: 4px; height: 4px; }
        .bar { flex: 1; background: #1f2937; border-radius: 4px; transition: 0.3s; }

        /* Opciones más pegadas */
        .section-title { font-size: 0.75rem; font-weight: 700; color: #475569; margin-bottom: 10px; text-transform: uppercase; }
        
        .option-item {
            background: rgba(255,255,255,0.02);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .option-item span { font-size: 0.9rem; }

        input[type="range"] {
            width: 100%; height: 4px; background: #1f2937;
            border-radius: 10px; appearance: none; margin: 15px 0 5px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; width: 18px; height: 18px;
            background: white; border-radius: 50%; border: 3px solid var(--primary);
        }

        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }

        /* Botón más bajo */
        .btn-generate {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: var(--neon);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        @media (max-width: 350px) {
            .container { padding: 15px; }
            #password-display { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <a href="https://vilcheslinense4.github.io/Mi-primer-portafolios/" class="back-btn">← Volver</a>

    <div class="card-wrapper">
        <div class="container">
            <h2>Generador Pro</h2>
            <p class="subtitle">Seguridad rápida y elegante</p>

            <div class="result-box">
                <div class="result-inner">
                    <span id="password-display">P4ssw0rd!</span>
                    <button class="copy-btn" id="copyBtn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                    </button>
                </div>
            </div>

            <div class="strength-container">
                <div class="strength-label">
                    <span>Fortaleza: <b id="st-text">Media</b></span>
                </div>
                <div class="strength-bars">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <p class="section-title">Configuración</p>
            
            <div class="option-item" style="flex-direction: column; align-items: flex-start;">
                <div style="display: flex; justify-content: space-between; width: 100%;">
                    <span>Longitud</span>
                    <b id="length-val" style="color: var(--primary)">16</b>
                </div>
                <input type="range" id="length" min="8" max="30" value="16">
            </div>

            <div class="option-item">
                <span>Mayúsculas</span>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="option-item">
                <span>Números</span>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="option-item">
                <span>Símbolos</span>
                <input type="checkbox" id="symbols" checked>
            </div>

            <button class="btn-generate" id="generateBtn">GENERAR CLAVE</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('password-display');
        const lengthInput = document.getElementById('length');
        const lengthVal = document.getElementById('length-val');
        const bars = document.querySelectorAll('.bar');
        const stText = document.getElementById('st-text');

        const keys = {
            lower: "abcdefghijklmnopqrstuvwxyz",
            upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            number: "0123456789",
            symbol: "!@#$%^&*"
        };

        function generate() {
            let charset = keys.lower;
            if (document.getElementById('uppercase').checked) charset += keys.upper;
            if (document.getElementById('numbers').checked) charset += keys.number;
            if (document.getElementById('symbols').checked) charset += keys.symbol;

            let password = "";
            for (let i = 0; i < lengthInput.value; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            display.innerText = password;
            updateStrength();
        }

        function updateStrength() {
            const len = lengthInput.value;
            let level = 1;
            if (len > 10) level = 2;
            if (len > 15) level = 3;
            if (len > 22) level = 4;

            const colors = ['#ef4444', '#f59e0b', '#06b6d4', '#10b981'];
            const texts = ['Débil', 'Media', 'Fuerte', 'Excelente'];

            bars.forEach((bar, idx) => {
                bar.style.background = idx < level ? colors[level-1] : '#1f2937';
                bar.style.boxShadow = idx < level ? `0 0 8px ${colors[level-1]}44` : 'none';
            });
            stText.innerText = texts[level-1];
            stText.style.color = colors[level-1];
        }

        lengthInput.addEventListener('input', () => {
            lengthVal.innerText = lengthInput.value;
            generate();
        });

        document.getElementById('generateBtn').addEventListener('click', generate);
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(display.innerText);
            const originalIcon = document.getElementById('copyBtn').innerHTML;
            document.getElementById('copyBtn').innerHTML = "✓";
            setTimeout(() => { document.getElementById('copyBtn').innerHTML = originalIcon; }, 1000);
        });

        generate();
    </script>
</body>
</html>
